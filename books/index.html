<style>
  /* ---------- the shelf beside the window, full bleed; the book in your hands floats over the wall ---------- */
  .shelf-room { cursor: default; }

  /* spines: one button per book. Without scripts they read as a plain list. */
  .shelf { margin: 0; padding: 0; list-style: none; }
  html:not(.js) .hero { height: auto; overflow: visible; padding-bottom: 170px; }
  html:not(.js) .hero > .room { position: static; background: none; padding: 32px var(--gutter); }
  html:not(.js) .shelf { columns: 2 18rem; column-gap: 3rem; }
  html:not(.js) .spine {
    all: unset; display: block; padding: 0.3rem 0; break-inside: avoid;
    font-family: var(--serif); font-size: 19px; line-height: 1.3;
  }
  html:not(.js) .spine .a { display: block; font-family: var(--sans); font-size: 13px; color: var(--quiet); }

  html.js .shelf { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
  html.js .shelf li { display: contents; }
  html.js .spine {
    position: absolute;
    left: 0; top: 0; width: 0; height: 0;
    margin: 0; padding: 0; border: 0;
    background: none; color: inherit; font: inherit;
    pointer-events: none;
    visibility: hidden;
    outline: none;
    transition: filter 0.18s ease;
  }
  .shelf-room.is-ready .spine { visibility: visible; }
  html.js .spine .t, html.js .spine .a { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .spine .hit, .spine .img, .spine .slot {
    position: absolute; inset: 0;
    clip-path: var(--clip);
  }
  .spine .hit { pointer-events: auto; cursor: pointer; }
  .spine .slot { background: rgba(14, 9, 4, 0.5); opacity: 0; transition: opacity 0.18s ease; pointer-events: none; }
  .spine .img {
    pointer-events: none;
    background-image: var(--hero);
    background-size: var(--bgs);
    background-position: var(--bgp);
    background-repeat: no-repeat;
    opacity: 0;
    transition: opacity 0.18s ease, transform 0.24s var(--ease-out), filter 0.18s ease;
  }
  .spine:hover, .spine:focus-visible, .spine.is-current { filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.35)); }
  .spine:hover .img, .spine:focus-visible .img { opacity: 1; transform: translateY(calc(var(--lift) * -1)); filter: brightness(1.2) saturate(1.06); }
  .spine:hover .slot, .spine:focus-visible .slot { opacity: 1; }
  .spine.is-current .img { opacity: 1; transform: translateY(calc(var(--lift) * -0.6)); filter: brightness(1.1); }
  .spine.is-current .slot { opacity: 0.85; }
  .spine:focus-visible .img { filter: brightness(1.24) saturate(1.06) drop-shadow(0 0 0.5px #fff); }

  .tip {
    position: absolute; z-index: 5;
    left: 0; top: 0;
    width: max-content;
    max-width: min(300px, 86%);
    padding: 0.45rem 0.75rem 0.5rem;
    border: 1px solid var(--hair);
    border-radius: 10px;
    background: color-mix(in oklab, var(--raised) 94%, transparent);
    color: var(--text);
    box-shadow: 0 10px 28px -12px var(--shade-deep);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    pointer-events: none;
    transform: translate(-50%, calc(-100% - 10px));
    line-height: 1.2;
  }
  .tip[hidden] { display: none; }
  .tip.below { transform: translate(-50%, 10px); }
  .tip .tt-t { display: block; font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 18px; }
  .tip .tt-a { display: block; margin-top: 3px; font-size: 12px; color: var(--quiet); }

  /* ---------- the reader: intro, and the book you took down, over the side wall ---------- */
  .books { position: relative; }
  .reader {
    position: absolute; z-index: 3;
    left: 0; top: 0; height: calc(var(--hero-h) - var(--mh));
    width: var(--card-col, 36vw);
    display: grid;
    grid-template-rows: auto 1fr;
    min-width: 0;
    padding: clamp(28px, 6vh, 72px) 0 clamp(16px, 3vh, 40px) clamp(28px, 4.4vw, 84px);
  }
  .intro { margin: 0; max-width: 24em; line-height: 1.45; }
  .intro .lede { font-family: var(--serif); font-style: italic; font-size: 22px; }
  .intro a { display: inline-block; margin-top: 6px; font-size: 13px; color: var(--on-scene-soft); white-space: nowrap; text-decoration: none; border-bottom: 1px solid var(--on-scene-faint); }
  .intro a:hover { color: var(--on-scene); border-bottom-color: rgba(244, 239, 230, 0.6); }

  .held {
    align-self: center;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: clamp(18px, 2.2vw, 36px);
    padding-top: 20px;
  }
  html:not(.js) .reader { display: none; }
  .card-wrap { flex: none; perspective: 1600px; }
  .card {
    position: relative;
    height: clamp(200px, 38vh, 420px);
    aspect-ratio: 2 / 3;
    transform-style: preserve-3d;
    transform: rotateY(0deg) scale(0.94);
    transition: transform 0.85s cubic-bezier(0.22, 0.85, 0.3, 1.04);
  }
  .card.is-open { transform: rotateY(-180deg) scale(1); }
  .card.no-anim { transition: none; }
  .face {
    position: absolute; inset: 0;
    -webkit-backface-visibility: hidden; backface-visibility: hidden;
    border-radius: 3px 4px 4px 3px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25), 0 26px 50px -18px rgba(0, 0, 0, 0.55), 0 8px 16px -8px rgba(0, 0, 0, 0.3);
  }
  .face-spine {
    display: grid; place-items: center;
    background: var(--card-bg, #444); color: var(--card-fg, #f5f1e6);
    text-shadow: none;
  }
  .face-spine::before { content: ""; position: absolute; top: 0; bottom: 0; left: 10px; width: 2px; background: rgba(255, 255, 255, 0.14); }
  .face-spine::after { content: ""; position: absolute; top: 0; bottom: 0; right: 0; width: 18px; background: linear-gradient(90deg, transparent, rgba(0, 0, 0, 0.3)); }
  .spine-text {
    display: flex; align-items: baseline; gap: 14px;
    transform: rotate(-90deg);
    white-space: nowrap;
    font-family: var(--serif);
  }
  .spine-text .t { font-weight: 600; font-size: 1.35rem; letter-spacing: 0.02em; }
  .spine-text .a { font-style: italic; font-size: 0.9rem; opacity: 0.78; }
  .face-cover { transform: rotateY(180deg); background: var(--card-bg, #444); }
  .face-cover img { display: block; width: 100%; height: 100%; object-fit: cover; filter: var(--media-dim); }
  .face-cover::after {
    /* the light of the room on the cover, and a hint of the hinge */
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(0, 0, 0, 0.18), transparent 4%, rgba(255, 255, 255, 0.06) 6%, transparent 12%),
      linear-gradient(160deg, rgba(255, 255, 255, 0.08), transparent 40%);
    pointer-events: none;
  }

  .label { flex: 1 1 11em; min-width: 0; max-width: 18em; padding-bottom: 2px; }
  .label > * { transition: opacity 0.35s ease 0.2s, transform 0.45s var(--ease-out) 0.2s; }
  .label.is-changing > .status, .label.is-changing > .title, .label.is-changing > .author { opacity: 0; transform: translateY(4px); transition: none; }
  .status { margin: 0 0 10px; font-size: 12px; letter-spacing: 0.03em; color: var(--on-scene-soft); }
  .status[hidden] { display: none; }
  .title {
    margin: 0;
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(26px, 2.3vw, 40px);
    line-height: 1.06;
    letter-spacing: -0.003em;
    text-wrap: balance;
  }
  .author { margin: 10px 0 0; font-size: 15px; color: var(--on-scene-soft); }
  .browse {
    display: flex; align-items: center; gap: 12px;
    margin-top: 26px;
    font-size: 12px; color: var(--on-scene-soft);
    font-variant-numeric: tabular-nums;
  }
  .browse button {
    display: grid; place-items: center;
    width: 32px; height: 32px; padding: 0;
    border: 1px solid var(--on-scene-faint); border-radius: 50%;
    background: rgba(0, 0, 0, 0.12); color: var(--on-scene);
    font: inherit; font-size: 14px; line-height: 1; text-shadow: inherit;
    cursor: pointer;
    transition: border-color 0.2s ease, background-color 0.2s ease;
  }
  .browse button:hover { border-color: rgba(244, 239, 230, 0.6); background: rgba(0, 0, 0, 0.22); }
  .reader :focus-visible { outline: 2px solid currentColor; outline-offset: 3px; border-radius: 2px; }

  /* ---------- phones and tall screens: the shelf fills the first screen; the book is below it, on the
     same wall (the photograph's own colours, blurred), so the room carries on as you scroll ---------- */
  @media (max-width: 760px), (max-aspect-ratio: 11/10) {
    .reader {
      position: relative; width: auto; height: auto;
      padding: 30px 16px 64px;
      /* the photograph's own wall, blurred right out: its 32px preview, enlarged on the plaster beside the shelf */
      background: var(--wall) var(--wall-blur, none) no-repeat 18% 62% / 600% auto;
    }
    .reader::before { content: ""; position: absolute; inset: 0; background: rgba(0, 0, 0, 0.18); pointer-events: none; }
    .reader > * { position: relative; }
    .intro .lede { font-size: 19px; }
    .held { padding-top: 26px; gap: 22px; flex-wrap: nowrap; }
    .card { height: auto; width: min(36vw, 240px); }
    .title { font-size: clamp(25px, 6.6vw, 40px); }
    .author { font-size: 14px; margin-top: 8px; }
    .browse { margin-top: 20px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .spine .img, .spine .slot, .label > * { transition: none !important; }
  }
</style>

<script>
  // Before the first paint: the book in your hands (from #id, else the first on the shelf), spine-out,
  // exactly as the module below will show it.
  (function () {
    try {
      var all = document.querySelectorAll("#shelf .spine"), b = all[0], h = decodeURIComponent(location.hash.slice(1));
      for (var i = 0; i < all.length; i++) if (all[i].getAttribute("data-id") === h) b = all[i];
      if (!b) return;
      var $ = function (id) { return document.getElementById(id); };
      var t = b.querySelector(".t").textContent, a = b.querySelector(".a").textContent, card = $("card");
      card.style.setProperty("--card-bg", b.getAttribute("data-bg") || "#444");
      card.style.setProperty("--card-fg", b.getAttribute("data-fg") || "#f5f1e6");
      $("card-spine-t").textContent = $("card-title").textContent = t;
      $("card-spine-a").textContent = $("card-author").textContent = a;
      $("card-status").hidden = !b.hasAttribute("data-reading");
    } catch (e) { /* the module fills it in */ }
  })();
</script>

<script type="module">
  // The page's behaviour lives in books/page.js, so the homepage's live room can host this page too.
  import { mount } from "/books/page.js";
  import { arrive } from "/shared/transition.js";
  const main = document.getElementById("main");
  const page = mount(main, { standalone: true });
  arrive({ ready: page.room.ready });
  // the live room (shared/router.js): fetched after first paint, never in the page's way
  (window.requestIdleCallback || ((f) => setTimeout(f, 300)))(() => import("/shared/router.js").then((m) => m.startRouter({
    doc: "books", hero: main.querySelector(".hero"),
    page: { handle: page, photo: () => page.room.geo && page.room.view && { view: "books", size: [page.room.view.width, page.room.view.height], geo: page.room.geo } },
  })).catch(() => {}), { timeout: 2500 });
</script>
