<script>
/* One continuous page (v3/qa-nav): a browser that can run the live room reads this page inside the homepage's
   document (/?page=books), so the room, the city and the sound go on from move to move (the essays' pages do the
   same, scripts/content/writing_pages.py). The page stays as it is without WebGL2, with reduced motion, Save-Data, a
   slow or small device (shared/gestures.js bootTier), ?3d=0, ?page-doc (tests), or when this visit's room did not
   start; search engines and visitors without JavaScript read it as before. */
(function () {
  try {
    var q = location.search;
    if (/[?&](3d=0|page-doc)(&|=|$)/.test(q)) return;
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var c = navigator.connection;
    if (c && (c.saveData || /(^|-)2g$/.test(c.effectiveType || ""))) return;
    if (navigator.deviceMemory && navigator.deviceMemory < 4) return;
    var s = window.sessionStorage;
    if (s && (s.getItem("sfw-room-off") === "1" || s.getItem("sfw-3d") === "0" || s.getItem("sfw-page-doc") === "1")) return;
    var g = document.createElement("canvas").getContext("webgl2");
    if (!g) return;
    var x = g.getExtension("WEBGL_lose_context");
    if (x) x.loseContext();
    q = q.replace(/^\?/, "");
    location.replace("/?page=books" + (q ? "&" + q : "") + location.hash);
  } catch (e) {}
})();
</script>

  /* ---------- the shelf beside the window, full bleed; the book in your hands floats over the wall ---------- */

  :root[data-moment="morning"], :root[data-moment="latemorning"], :root[data-moment="midday"], :root[data-moment="afternoon"],

  /* the shade: wide and blurred well past the words, so it reads as the light falling off, not a patch */
  .intro::before {

  /* DYS-11 (Akshay, 30 Oct): that wide shade read as a dirty patch on the wall, the more so on the lighter, cleaned
     walls. On desktops the cream caption at twilight and night keeps its contrast with a halo hugging the letters
     instead (on the lighter walls of B walls + the night balance: the letters against their halo 5.9:1 median at

  @media not all and (max-width: 760px) {

      :root[data-moment="blue"], :root[data-moment="night"], :root[data-moment="predawn"], :root[data-moment="dawn"],

  }

  .status[hidden] { display: none; }

    margin: 0;
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(26px, 2.3vw, 40px);
    line-height: 1.06;
    letter-spacing: -0.003em;
    text-wrap: balance;
  }
  .author { margin: 10px 0 0; font-size: 15px; color: var(--on-scene-soft); }
  .browse {
    display: flex; align-items: center; gap: 12px;
    margin-top: 26px;
    font-size: 12px; color: var(--on-scene-soft);
    font-variant-numeric: tabular-nums;
  }
  .browse button {
    display: grid; place-items: center;
    width: 32px; height: 32px; padding: 0;
    border: 1px solid var(--on-scene-faint); border-radius: 50%;
    background: rgba(0, 0, 0, 0.12); color: var(--on-scene);
    font: inherit; font-size: 14px; line-height: 1; text-shadow: inherit;
    cursor: pointer;
    transition: border-color 0.2s ease, background-color 0.2s ease;
  }
  .browse button:hover { border-color: rgba(244, 239, 230, 0.6); background: rgba(0, 0, 0, 0.22); }
  .reader :focus-visible { outline: 2px solid currentColor; outline-offset: 3px; border-radius: 2px; }

  /* ---------- phones and tall screens: the shelf fills the first screen; the book is below it, on the
     same wall (the photograph's own colours, blurred), so the room carries on as you scroll ---------- */
  @media (max-width: 760px), (max-aspect-ratio: 11/10) {
    .reader {
      position: relative; width: auto; height: auto;
      padding: 30px 16px 64px;
      /* the photograph's own wall, blurred right out: its 32px preview, enlarged on the plaster beside the shelf */
      background: var(--wall) var(--wall-blur, none) no-repeat 18% 62% / 600% auto;
    }
    .reader::before { content: ""; position: absolute; inset: 0; background: rgba(0, 0, 0, 0.18); pointer-events: none; }
    .reader > * { position: relative; }
    .intro .lede { font-size: 19px; }
    /* (F5: by day the reader's veil darkens the wall behind the dark ink; a faint warm light under the caption alone) */
    :root[data-moment="morning"] .intro, :root[data-moment="latemorning"] .intro, :root[data-moment="midday"] .intro,
    :root[data-moment="afternoon"] .intro, :root[data-moment="lateafternoon"] .intro, :root[data-moment="golden"] .intro,
    :root[data-moment="lowsun"] .intro { --caption-shade: rgba(245, 238, 226, 0.16); }
    /* (the shade's box inside the reader's 16 px margin: wider, it made the page wider than the phone; the blur still
       softens its edge, and a blur never widens the page) */
    .intro::before { inset: -10px -16px; }
    .held { padding-top: 26px; gap: 22px; flex-wrap: nowrap; }
    .card { height: auto; width: min(36vw, 240px); }
    .title { font-size: clamp(25px, 6.6vw, 40px); }
    .author { font-size: 14px; margin-top: 8px; }
    .browse { margin-top: 20px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .spine .img, .spine .slot, .label > *, .label-ghost > * { transition: none !important; }
  }

  /* ---------- DYS-29 (a) (Akshay's pick, 28 Oct; the mock's names kept): the shelf has the whole view and no card shows until a
     book is picked; its details come up in a compact panel beside the shelf (phones: above or below the book). page.js
     sets .shelfmock on <main>. ---------- */
  /* the caption stays top left, clear of the shelf (page.js keeps --mock-shelf-l, the shelf's left edge on screen) */
  .shelfmock .reader { width: auto; height: auto; pointer-events: none; }
  .shelfmock .reader .intro { pointer-events: auto; max-width: min(24em, max(10em, calc(var(--mock-shelf-l, 100vw) - clamp(28px, 4.4vw, 84px) - 28px))); }
  /* the book shown on arrival is not picked: no marks on its spine until one is */
  .shelfmock:not(.mock-open) .spine.is-current:not(:hover):not(:focus-visible) { filter: none; }
  .shelfmock:not(.mock-open) .spine.is-current:not(:hover):not(:focus-visible) .slot { opacity: 0; }
  .shelfmock:not(.mock-open) .spine.is-current:not(:hover):not(:focus-visible) .img { opacity: 0; transform: none; }
  /* (DYS-29, Akshay 28 Oct: "the highlight over the book - it doesnt seem to be the book"): the picked book is the 3D
     book itself, slid out (shared/gl/interact.js; the others dim there); its picture here sits on the shelf's front
     plane, not on the spine, so while it is open it never shows, not even under the pointer */
  .shelfmock.mock-open .spine.is-current, .shelfmock.mock-open .spine.is-current:hover, .shelfmock.mock-open .spine.is-current:focus-visible { filter: none; }
  .shelfmock.mock-open .spine.is-current .img, .shelfmock.mock-open .spine.is-current .slot { opacity: 0 !important; transform: none !important; }
  /* the panel: over the room, placed by page.js; its surface and contents fade (the panel itself never does, so the
     surface's backdrop blur shows through the fade instead of popping in at its end) */
  .shelfmock .held {
    position: absolute; z-index: 6; left: 0; top: 0;
    box-sizing: border-box; width: min(360px, calc(100% - 24px));
    flex-wrap: nowrap; align-items: center; gap: 16px;
    padding: 14px 40px 14px 14px;
    color: var(--on-scene); text-shadow: none;
    visibility: hidden; transform: translateY(6px);
    transition: transform 0.3s var(--ease-out), visibility 0s linear 0.25s;
  }
  .shelfmock.mock-open .held { visibility: visible; transform: none; transition: transform 0.32s var(--ease-out), visibility 0s; }
  .shelfmock .held::before {
    content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
    border-radius: 14px; border: 1px solid rgba(255, 250, 242, 0.14);
    background: rgba(20, 15, 11, 0.64);
    -webkit-backdrop-filter: blur(14px) saturate(1.1); backdrop-filter: blur(14px) saturate(1.1);
    box-shadow: 0 22px 44px -20px rgba(0, 0, 0, 0.65);
  }
  .shelfmock .held::before, .shelfmock .held > * { opacity: 0; transition: opacity 0.2s ease; }
  .shelfmock.mock-open .held::before, .shelfmock.mock-open .held > * { opacity: 1; transition: opacity 0.25s ease; }
  .shelfmock .card-wrap { flex: none; }
  .shelfmock .card { height: 156px; width: auto; }
  .shelfmock .spine-text .t { font-size: 0.95rem; }
  .shelfmock .spine-text .a { font-size: 0.72rem; }
  .shelfmock .label { flex: 1 1 auto; min-width: 0; max-width: none; padding-bottom: 0; }
  .shelfmock .status { margin-bottom: 6px; }
  .shelfmock .title { font-size: 24px; }
  .shelfmock .author { margin-top: 6px; font-size: 14px; }
  .shelfmock .browse { margin-top: 14px; }
  .shelfmock .held :focus-visible { outline: 2px solid currentColor; outline-offset: 3px; border-radius: 2px; }
  .shelfmock .mock-x {
    position: absolute; top: 8px; right: 8px;
    display: grid; place-items: center; width: 28px; height: 28px; padding: 0;
    border: 0; border-radius: 50%; background: rgba(255, 250, 242, 0.08); color: var(--on-scene-soft);
    font: inherit; font-size: 18px; line-height: 1; cursor: pointer;
  }
  .shelfmock .mock-x:hover { background: rgba(255, 250, 242, 0.16); color: var(--on-scene); }
  /* the caret toward the picked book, on the panel's edge page.js names */
  .shelfmock .mock-caret { position: absolute; background: rgba(20, 15, 11, 0.64); pointer-events: none; }
  .shelfmock .mock-caret:not([data-side]) { display: none; }
  .shelfmock .mock-caret[data-side="left"] { left: -9px; width: 9px; height: 16px; margin-top: -8px; clip-path: polygon(100% 0, 0 50%, 100% 100%); }
  .shelfmock .mock-caret[data-side="right"] { right: -9px; width: 9px; height: 16px; margin-top: -8px; clip-path: polygon(0 0, 100% 50%, 0 100%); }
  .shelfmock .mock-caret[data-side="bottom"] { bottom: -9px; width: 16px; height: 9px; margin-left: -8px; clip-path: polygon(0 0, 100% 0, 50% 100%); }
  .shelfmock .mock-caret[data-side="top"] { top: -9px; width: 16px; height: 9px; margin-left: -8px; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  /* phones and tall screens: the caption stays below the shelf as today; the panel is smaller */
  @media (max-width: 760px), (max-aspect-ratio: 11/10) {
    .shelfmock .reader .intro { max-width: 24em; }
    .shelfmock .held { width: min(350px, calc(100% - 24px)); padding: 12px 40px 12px 12px; gap: 12px; }
    .shelfmock .card { height: 114px; }
    .shelfmock .title { font-size: 19px; }
    .shelfmock .author { margin-top: 4px; font-size: 13px; }
    .shelfmock .status { margin-bottom: 4px; }
    .shelfmock .browse { margin-top: 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .shelfmock .held, .shelfmock .held::before, .shelfmock .held > * { transition: none !important; }
  }
</style>

<script>
  // Before the first paint: the book in your hands (from #id, else the first on the shelf), spine-out,
  // exactly as the module below will show it.
  (function () {
    try {
      var all = document.querySelectorAll("#shelf .spine"), b = all[0], h = decodeURIComponent(location.hash.slice(1));
      for (var i = 0; i < all.length; i++) if (all[i].getAttribute("data-id") === h) b = all[i];
      if (!b) return;
      var $ = function (id) { return document.getElementById(id); };
      var t = b.querySelector(".t").textContent, a = b.querySelector(".a").textContent, card = $("card");
      card.style.setProperty("--card-bg", b.getAttribute("data-bg") || "#444");
      card.style.setProperty("--card-fg", b.getAttribute("data-fg") || "#f5f1e6");
      $("card-spine-t").textContent = $("card-title").textContent = t;
      $("card-spine-a").textContent = $("card-author").textContent = a;
      $("card-status").hidden = !b.hasAttribute("data-reading");
    } catch (e) { /* the module fills it in */ }
  })();
</script>

<script type="module">
  // The page's behaviour lives in books/page.js, so the homepage's live room can host this page too.
  import { mount } from "/books/page.js";
  import { arrive } from "/shared/transition.js";
  const main = document.getElementById("main");
  const page = mount(main, { standalone: true });
  arrive({ ready: page.room.ready });
  // the live room (shared/router.js): fetched after first paint, never in the page's way
  (window.requestIdleCallback || ((f) => setTimeout(f, 300)))(() => import("/shared/router.js").then((m) => m.startRouter({
    doc: "books", hero: main.querySelector(".hero"),
    page: { handle: page, photo: () => page.room.geo && page.room.view && { view: "books", size: [page.room.view.width, page.room.view.height], geo: page.room.geo } },
  })).catch(() => {}), { timeout: 2500 });
</script>
